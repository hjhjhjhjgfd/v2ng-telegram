name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;33.0.2 platforms;android-33"

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.11
        with:
          repository: '2dust/AndroidLibXrayLite'
          latest: true
          fileName: 'libv2ray.aar'
          out-file-path: 'V2rayNG/app/libs'

      - name: Grant execute permission for gradlew
        run: chmod +x ./V2rayNG/gradlew

      - name: Build debug APK (all flavors)
        working-directory: V2rayNG
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List built APKs
        working-directory: V2rayNG
        run: |
          echo "::group::Built APKs"
          find . -type f -name '*.apk' -print -exec ls -lh {} \;
          echo "::endgroup::"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnng-telegram-apks
          path: |
            V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
