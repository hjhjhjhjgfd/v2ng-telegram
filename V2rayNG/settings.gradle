pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JCenter is dead (Feb 2022).  Use Aliyun's mirror for the
        // handful of legacy artifacts (rxpermissions 0.9.4) that were
        // only published there; everything else resolves from the
        // standard Central / Google repos above.
        maven { url = uri("https://maven.aliyun.com/repository/jcenter") }
        maven { url = uri("https://jitpack.io") }
    }
}
rootProject.name = "V2rayNG"
include(":app")